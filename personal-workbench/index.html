<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
:root{--bg:#f4f0e8;--panel:#fffdf8;--panel2:#eee9df;--ink:#484740;--muted:#918d83;--line:#e6dfd3;--sage:#aab7a4;--sage2:#e0e8dc;--rose:#cba69d;--rose2:#f1e2dd;--blue:#a9b8c8;--gold:#c9b88d;--shadow:0 12px 35px #544b3b12;--radius:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:#ede8df;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:25px}.brand{padding:6px 12px}.brand-mark{width:35px;height:35px;border-radius:50%;background:var(--rose2);display:grid;place-items:center;font-family:Georgia;font-size:20px;color:#a37e74}.brand h1{font:600 19px 'Playfair Display',serif;margin:12px 0 2px}.brand p{margin:0;color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase}.nav-label{font-size:10px;letter-spacing:1.7px;color:#aaa398;padding:0 13px;margin-bottom:7px}.nav{display:grid;gap:4px}.nav button{background:transparent;text-align:left;padding:11px 13px;border-radius:12px;color:#77746c;display:flex;gap:12px;align-items:center}.nav button:hover{background:#fff9}.nav button.active{background:linear-gradient(100deg,#d9c2ba,#b8c3b1);color:#4c4b43;font-weight:600}.nav .ico{width:18px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;padding:14px 12px;color:var(--muted);font-size:11px;line-height:1.7}.main{min-width:0}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 4.5%;border-bottom:1px solid var(--line);background:#f7f4eecc;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:10px}.date-pill,.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:9px 13px;color:var(--muted)}.icon-btn{width:38px;height:38px;padding:0}.content{max-width:1440px;margin:auto;padding:34px 4.5% 60px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--rose);text-transform:uppercase;font-weight:700}.page-head h2{font:500 clamp(27px,3vw,38px) 'Playfair Display',serif;margin:7px 0 4px}.sub{color:var(--muted);margin:0}.btn{background:var(--ink);color:#fffdf8;border-radius:12px;padding:11px 16px;font-weight:600}.btn.soft{background:var(--sage2);color:#566052}.btn.rose{background:var(--rose2);color:#88665e}.btn.small{padding:7px 11px;font-size:12px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid #e9e3d8;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}.stat{display:flex;align-items:center;gap:14px}.stat-icon{width:43px;height:43px;border-radius:14px;background:var(--rose2);display:grid;place-items:center;font-size:19px}.stat:nth-child(2) .stat-icon{background:var(--sage2)}.stat:nth-child(3) .stat-icon{background:#e6eaf0}.stat:nth-child(4) .stat-icon{background:#f0e8d5}.stat strong{font:600 25px 'Playfair Display',serif;display:block}.stat span{color:var(--muted);font-size:11px}.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.card-title h3{font:600 17px 'Playfair Display',serif;margin:0}.muted{color:var(--muted)}.task{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.check{width:19px;height:19px;border:1px solid #c9c3b8;border-radius:6px;background:transparent;flex:none}.check.done{background:var(--sage);border-color:var(--sage);color:white}.task-main{min-width:0;flex:1}.task-main b{display:block;font-size:13px;font-weight:600}.task-main small{color:var(--muted)}.done-text{text-decoration:line-through;color:#aaa}.tag{display:inline-block;border-radius:20px;padding:4px 8px;background:var(--sage2);color:#687663;font-size:10px}.tag.rose{background:var(--rose2);color:#956f65}.tag.blue{background:#e7edf2;color:#6b7e90}.progress{height:7px;border-radius:10px;background:var(--panel2);overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--sage));border-radius:10px}.planner-col{background:#f8f5ef;border-radius:15px;padding:15px}.planner-col h4{margin:0 0 10px;font-size:12px;color:var(--muted)}.field{width:100%;background:#faf8f3;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}.row .field{flex:1}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.toolbar .field{max-width:230px}.list-item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.list-item:last-child{border:0}.list-item .grow{flex:1;min-width:0}.list-item h4{margin:0 0 4px;font-size:13px}.list-item p{margin:0;color:var(--muted);font-size:11px}.pill{background:var(--panel2);border-radius:30px;padding:7px 11px;font-size:11px;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dayname{text-align:center;color:var(--muted);font-size:10px;padding:8px}.day{min-height:92px;background:#faf8f3;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left}.day.today{border:1.5px solid var(--rose)}.day.other{opacity:.35}.day .num{font-weight:600}.day .event-dot{display:block;margin-top:7px;font-size:9px;color:#8a786c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.habit{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.habit-days{display:flex;gap:5px}.habit-days button{width:25px;height:25px;border-radius:50%;background:var(--panel2);font-size:9px;color:var(--muted)}.habit-days button.on{background:var(--sage);color:white}.timer{font:500 clamp(50px,9vw,82px) 'Playfair Display',serif;text-align:center;padding:20px 0}.timer-ring{width:min(310px,75vw);height:min(310px,75vw);border:9px solid var(--sage2);border-top-color:var(--rose);border-radius:50%;margin:15px auto;display:grid;place-items:center}.mind{width:100%;min-height:310px;resize:vertical;line-height:1.8}.note{min-height:230px;resize:vertical;line-height:1.7}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.empty span{font-size:28px;display:block;margin-bottom:8px}.modal-back{position:fixed;inset:0;background:#302d2780;z-index:20;display:grid;place-items:center;padding:20px}.modal{background:var(--panel);width:min(500px,100%);border-radius:20px;padding:24px;box-shadow:0 20px 70px #0003}.modal h3{font:600 22px 'Playfair Display',serif;margin:0 0 18px}.modal label{display:block;font-size:11px;color:var(--muted);margin:12px 0 6px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.hidden{display:none!important}.footer{text-align:center;color:#aaa398;font-size:10px;padding:24px}.dark{--bg:#252522;--panel:#33332f;--panel2:#41413b;--ink:#eee9df;--muted:#aaa69a;--line:#4b4a43;--sage2:#3e4a3c;--rose2:#51403c;--shadow:0 12px 35px #0002}.dark .sidebar{background:#2c2c28}.dark .topbar{background:#292925dd}.dark .planner-col,.dark .field,.dark .day{background:#393933}.dark .nav button.active{color:#262620}.dark .tag{color:#d5e0cf}.dark .tag.rose{color:#e4c3ba}.dark .tag.blue{color:#c5d4e2}
@media(max-width:900px){.app{grid-template-columns:75px 1fr}.sidebar{padding:20px 9px}.brand{padding:5px;text-align:center}.brand h1,.brand p,.nav-label,.nav button .nav-text,.side-bottom{display:none}.nav button{justify-content:center;padding:12px 5px}.nav .ico{font-size:18px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:600px){.app{display:block;padding-bottom:68px}.sidebar{position:fixed;bottom:0;left:0;right:0;height:64px;z-index:10;padding:5px 8px;border-right:0;border-top:1px solid var(--line);display:block}.brand,.nav-label,.side-bottom{display:none}.nav{display:flex;justify-content:space-around;gap:0}.nav button{display:grid;gap:0;padding:7px 5px;font-size:9px;justify-items:center;min-width:0}.nav button .nav-text{display:block;font-size:9px}.nav .ico{font-size:16px}.topbar{height:58px;padding:0 15px}.content{padding:24px 15px 30px}.page-head{align-items:flex-start}.page-head .btn{font-size:11px;padding:9px}.stats{gap:9px}.card{padding:15px;border-radius:16px}.three{grid-template-columns:1fr}.calendar{gap:3px}.day{min-height:68px;padding:5px;border-radius:8px}.day .event-dot{font-size:8px}.dayname{font-size:9px}.date-pill{font-size:10px}.top-actions{gap:5px}.crumb{font-size:10px}}
</style>

<body>
<div class="app" id="app">
<aside class="sidebar">
 <div class="brand"><div class="brand-mark">✿</div><h1>Personal Workbench</h1><p>diaryofagianna</p></div>
 <div><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav">
 <button class="active" data-page="home"><span class="ico">⌂</span><span class="nav-text">Overview</span></button>
 <button data-page="today"><span class="ico">☼</span><span class="nav-text">Today planner</span></button>
 <button data-page="tasks"><span class="ico">☑</span><span class="nav-text">Tasks</span></button>
 <button data-page="matrix"><span class="ico">⊞</span><span class="nav-text">Four quadrants</span></button>
 <button data-page="calendar"><span class="ico">▦</span><span class="nav-text">Calendar</span></button>
 <button data-page="mind"><span class="ico">⌘</span><span class="nav-text">Mind map</span></button>
 <button data-page="notes"><span class="ico">▤</span><span class="nav-text">Knowledge base</span></button>
 <button data-page="focus"><span class="ico">◷</span><span class="nav-text">Focus</span></button>
 <button data-page="habits"><span class="ico">✳</span><span class="nav-text">Habits</span></button>
 <button data-page="review"><span class="ico">▥</span><span class="nav-text">Weekly review</span></button>
 <button data-page="settings"><span class="ico">⚙</span><span class="nav-text">Data & settings</span></button>
 </nav></div>
 <div class="side-bottom">A little space for all the things that matter.<br>Local-first · Your data stays yours ♡</div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb" id="crumb">Your gentle space / Overview</div><div class="top-actions"><span class="date-pill" id="todayLabel"></span><button class="icon-btn" id="themeBtn" title="Toggle theme">☾</button></div></header>
<div class="content" id="view"></div><div class="footer">made with care · diaryofagianna ✿ · your data stays in this browser</div>
</main></div>
<div id="modalRoot"></div>
<script>
(function(){
const KEY='diaryofagianna.personal-workbench.v1';
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,10);
const initial={tasks:[{id:uid(),title:'Plan a gentle week',due:today(),priority:'Important',quadrant:'important',status:'open',category:'Personal',notes:'',created:today()},{id:uid(),title:'Read for 20 minutes',due:today(),priority:'Normal',quadrant:'not-urgent',status:'open',category:'Growth',notes:'',created:today()}],plans:[],habits:[{id:uid(),name:'Drink enough water',days:{}},{id:uid(),name:'Read a little',days:{}},{id:uid(),name:'Evening reset',days:{}}],notes:[{id:uid(),title:'A little welcome note',body:'Welcome to your personal workbench.\n\nUse this space for ideas, plans, and the small things you want to remember.',updated:today()}],mind:'My little ideas\n  Work & projects\n  Personal growth\n  Places to explore\n  Things to create',events:[],settings:{theme:'light',lunar:false,username:'Gianna'},focus:{minutes:25}};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial}catch(e){data=initial}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
const allDone=()=>data.tasks.filter(t=>t.status==='done').length;
let page='home',month=new Date(),timer=null,remaining=1500,running=false;
const view=document.getElementById('view');
document.getElementById('todayLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent='Your gentle space / '+({home:'Overview',today:'Today planner',tasks:'Tasks',matrix:'Four quadrants',calendar:'Calendar',mind:'Mind map',notes:'Knowledge base',focus:'Focus',habits:'Habits',review:'Weekly review',settings:'Data & settings'}[p]);render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
document.getElementById('themeBtn').onclick=()=>{data.settings.theme=data.settings.theme==='dark'?'light':'dark';save();applyTheme()};
function applyTheme(){document.body.classList.toggle('dark',data.settings.theme==='dark');document.getElementById('themeBtn').textContent=data.settings.theme==='dark'?'☀':'☾'}applyTheme();
function head(kicker,title,sub,action){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h2>'+title+'</h2><p class="sub">'+sub+'</p></div>'+(action||'')+'</div>'}
function stat(icon,n,label){return '<div class="card stat"><div class="stat-icon">'+icon+'</div><div><strong>'+n+'</strong><span>'+label+'</span></div></div>'}
function taskRow(t){return '<div class="task"><button class="check '+(t.status==='done'?'done':'')+'" data-done="'+t.id+'">'+(t.status==='done'?'✓':'')+'</button><div class="task-main"><b class="'+(t.status==='done'?'done-text':'')+'">'+esc(t.title)+'</b><small>'+esc(t.category||'Personal')+' · '+(t.due?fmt(t.due):'No date')+'</small></div><span class="tag '+(t.priority==='High'?'rose':'')+'">'+esc(t.priority||'Normal')+'</span><button class="icon-btn" data-edit="'+t.id+'" title="Edit">···</button></div>'}
function empty(text){return '<div class="empty"><span>✿</span>'+text+'</div>'}
function render(){save();if(page==='home')home();if(page==='today')todayPage();if(page==='tasks')tasksPage();if(page==='matrix')matrixPage();if(page==='calendar')calendarPage();if(page==='mind')mindPage();if(page==='notes')notesPage();if(page==='focus')focusPage();if(page==='habits')habitsPage();if(page==='review')reviewPage();if(page==='settings')settingsPage()}
function home(){const open=data.tasks.filter(t=>t.status!=='done'),due=open.filter(t=>t.due===today()),pct=data.tasks.length?Math.round(allDone()/data.tasks.length*100):0;
view.innerHTML=head('A SOFTER WAY TO GET THINGS DONE','Good day, '+esc(data.settings.username||'friend')+' ♡','A little progress is still progress. Here is your space today.','<button class="btn" data-action="add-task">＋ New task</button>')+
'<div class="grid stats">'+stat('☑',due.length,'Due today')+stat('◷',pct+'%','Tasks completed')+stat('✳',data.habits.length,'Little habits')+stat('▤',data.notes.length,'Saved notes')+'</div>'+
'<div class="grid two"><section class="card"><div class="card-title"><h3>Today’s little list</h3><button class="btn soft small" data-page="tasks">All tasks →</button></div>'+(due.length?due.slice(0,5).map(taskRow).join(''):empty('Nothing due today. Enjoy the breathing room.'))+'</section><section class="card"><div class="card-title"><h3>Weekly rhythm</h3><span class="muted">This week</span></div><div style="font:500 40px Playfair Display;margin:10px 0">'+pct+'%</div><div class="progress"><i style="width:'+pct+'%"></i></div><p class="muted" style="font-size:12px;margin-top:12px">'+allDone()+' of '+data.tasks.length+' tasks completed</p><div class="card-title" style="margin-top:26px"><h3>Recent notes</h3><button class="btn soft small" data-page="notes">Open →</button></div>'+(data.notes.slice(0,2).map(n=>'<div class="list-item"><span>✎</span><div class="grow"><h4>'+esc(n.title)+'</h4><p>'+fmt(n.updated||today())+'</p></div></div>').join('')||empty('Your notes will appear here.'))+'</section></div>'}
function todayPage(){const slots=['Morning','Afternoon','Evening'];view.innerHTML=head('PLAN WITH INTENTION','Today planner','A simple rhythm for the day, with room to breathe.','<button class="btn" data-action="add-plan">＋ Add to plan</button>')+'<div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><b>'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</b><span class="tag">'+data.plans.filter(p=>p.date===today()&&p.done).length+' / '+data.plans.filter(p=>p.date===today()).length+' completed</span></div><div class="progress" style="margin-top:12px"><i style="width:'+Math.round((data.plans.filter(p=>p.date===today()&&p.done).length/Math.max(1,data.plans.filter(p=>p.date===today()).length))*100)+'%"></i></div></div><div class="grid three">'+slots.map((s,i)=>'<section class="card planner-col"><h4>'+(i===0?'☀ ':'◒ ')+s+'</h4>'+(data.plans.filter(p=>p.date===today()&&p.slot===s).map(p=>'<div class="task"><button class="check '+(p.done?'done':'')+'" data-plan-done="'+p.id+'">'+(p.done?'✓':'')+'</button><div class="task-main"><b class="'+(p.done?'done-text':'')+'">'+esc(p.title)+'</b></div><button class="icon-btn" data-plan-delete="'+p.id+'">×</button></div>').join('')||'<p class="muted" style="font-size:12px">A fresh page for '+s.toLowerCase()+'.</p>')+'</section>').join('')+'</div>'}
function tasksPage(){view.innerHTML=head('KEEP IT CLEAR','Tasks & projects','Capture, sort, and finish one thing at a time.','<button class="btn" data-action="add-task">＋ New task</button>')+'<div class="toolbar"><input class="field" id="taskSearch" placeholder="Search tasks…"><select class="field" id="taskFilter"><option value="all">All tasks</option><option value="open">Open</option><option value="done">Completed</option></select><select class="field" id="taskSort"><option value="due">Due date</option><option value="priority">Priority</option></select></div><section class="card" id="taskList"></section>';fillTasks()}
function fillTasks(){const q=(document.getElementById('taskSearch')?.value||'').toLowerCase(),f=document.getElementById('taskFilter')?.value||'all',sort=document.getElementById('taskSort')?.value||'due';let ts=data.tasks.filter(t=>(f==='all'||(f==='done'?t.status==='done':t.status!=='done'))&&t.title.toLowerCase().includes(q));ts.sort((a,b)=>sort==='due'?(a.due||'9999').localeCompare(b.due||'9999'):(b.priority==='High'?1:0)-(a.priority==='High'?1:0));document.getElementById('taskList').innerHTML=ts.length?ts.map(taskRow).join(''):empty('No tasks found. Add a little task to begin.')}
function matrixPage(){const qs=[['important','Do first','rose'],['delegate','Schedule or share','blue'],['not-urgent','Decide later',''],['eliminate','Let go','']];view.innerHTML=head('CHOOSE WHAT MATTERS','Four quadrants','A gentle Eisenhower matrix for deciding what deserves your energy.','<button class="btn" data-action="add-task">＋ New task</button>')+'<div class="grid two">'+qs.map(([q,title,c])=>'<section class="card"><div class="card-title"><h3>'+title+'</h3><span class="tag '+c+'">'+data.tasks.filter(t=>t.quadrant===q&&t.status!=='done').length+'</span></div>'+(data.tasks.filter(t=>t.quadrant===q&&t.status!=='done').map(t=>'<div class="list-item"><div class="grow"><h4>'+esc(t.title)+'</h4><p>'+esc(t.category||'Personal')+' · '+(t.due?fmt(t.due):'No date')+'</p></div><button class="icon-btn" data-edit="'+t.id+'">···</button></div>').join('')||empty('Nothing here for now.'))+'</section>').join('')+'</div>'}
function calendarPage(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<42;i++){let d=i-start+1,valid=d>0&&d<=days,dt=new Date(y,m,d),iso=valid?dt.toISOString().slice(0,10):'',ev=[...data.events.filter(e=>e.date===iso),...data.tasks.filter(t=>t.due===iso)];cells+='<button class="day '+(!valid?'other':'')+' '+(iso===today()?'today':'')+'" data-date="'+iso+'"><span class="num">'+(valid?d:'')+'</span>'+ev.slice(0,2).map(e=>'<span class="event-dot">· '+esc(e.title)+'</span>').join('')+'</button>'}
view.innerHTML=head('MAKE SPACE FOR LIFE','Calendar','A month at a glance. Add meaningful dates and little reminders.','<button class="btn" data-action="add-event">＋ Add event</button>')+'<section class="card"><div class="card-title"><button class="btn soft small" id="prevMonth">←</button><h3>'+month.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</h3><div class="row"><button class="btn soft small" id="nextMonth">→</button><button class="btn small" id="lunarBtn">'+(data.settings.lunar?'Lunar view':'Solar view')+'</button></div></div><div class="calendar">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<div class="dayname">'+x+'</div>').join('')+cells+'</div><p class="muted" style="font-size:11px;margin-top:14px">Select a day to add a note or event. Lunar view is a visual calendar mode; verify local holiday dates separately.</p></section>'}
function mindPage(){view.innerHTML=head('LET IDEAS FIND EACH OTHER','Mind map','A flexible text canvas. Indent lines to create branches.','<button class="btn" id="saveMind">Save mind map</button>')+'<section class="card"><textarea class="field mind" id="mindText" placeholder="Main idea\n  First branch\n    A small detail\n  Second branch">'+esc(data.mind)+'</textarea><p class="muted" style="font-size:11px">Tip: use spaces before a line to show its level. Your map is saved locally.</p></section>'}
function notesPage(){view.innerHTML=head('KEEP THE THINGS YOU LEARN','Knowledge base','A quiet home for notes, references, and ideas.','<button class="btn" data-action="add-note">＋ New note</button>')+'<div class="grid two"><section class="card"><div class="card-title"><h3>Your notes</h3><span class="tag">'+data.notes.length+' saved</span></div>'+(data.notes.map(n=>'<div class="list-item"><span>▤</span><div class="grow"><h4>'+esc(n.title)+'</h4><p>'+fmt(n.updated||today())+'</p></div><button class="btn soft small" data-note-edit="'+n.id+'">Open</button></div>').join('')||empty('No notes yet.'))+'</section><section class="card"><h3 style="font:600 17px Playfair Display;margin:0 0 12px">Markdown-friendly notes</h3><p class="muted" style="font-size:12px;line-height:1.7">Write with headings, checklists, links, and simple formatting. Notes stay in this browser and are included in your JSON backup.</p></section></div>'}
function focusPage(){view.innerHTML=head('ONE THING AT A TIME','Focus room','A little focused time, followed by a little rest.','')+'<section class="card" style="text-align:center;max-width:650px;margin:auto"><div class="row" style="justify-content:center"><button class="pill" data-min="25">Pomodoro · 25</button><button class="pill" data-min="15">Short · 15</button><button class="pill" data-min="5">Break · 5</button></div><div class="timer-ring"><div><div class="timer" id="timerText">'+timeStr(remaining)+'</div><div class="muted" style="font-size:11px">MINDFUL MOMENT</div></div></div><div class="row" style="justify-content:center"><button class="btn" id="timerToggle">'+(running?'Pause':'Start focus')+'</button><button class="btn soft" id="timerReset">Reset</button></div><p class="muted" style="font-size:11px;margin-top:18px">Put away the noise. You only need to begin.</p></section>'}
function timeStr(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function habitsPage(){view.innerHTML=head('SMALL THINGS ADD UP','Habit garden','Build a gentle rhythm, one check-in at a time.','<button class="btn" data-action="add-habit">＋ Add habit</button>')+'<section class="card"><div class="card-title"><h3>Your little habits</h3><span class="muted">Last 7 days</span></div>'+(data.habits.map(h=>'<div class="habit"><div><b>'+esc(h.name)+'</b><div class="muted" style="font-size:10px;margin-top:4px">'+Object.values(h.days).filter(Boolean).length+' check-ins</div></div><div class="habit-days">'+Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=d.toISOString().slice(0,10);return '<button class="'+(h.days[k]?'on':'')+'" data-habit="'+h.id+'" data-habit-date="'+k+'" title="'+k+'">'+d.toLocaleDateString(undefined,{weekday:'narrow'})+'</button>'}).join('')+'</div></div>').join('')||empty('Plant your first little habit.'))+'</section>'}
function reviewPage(){let week=data.tasks.filter(t=>{let d=new Date(t.due||t.created||today()),n=new Date();return (n-d)/86400000<7&&(n-d)/86400000>=0});let done=week.filter(t=>t.status==='done').length;view.innerHTML=head('NOTICE YOUR PROGRESS','Weekly review','Celebrate what moved forward. Make room for what comes next.','<button class="btn" id="shareReview">Copy weekly summary</button>')+'<div class="grid stats">'+stat('✓',done,'Completed this week')+stat('◷',week.length-done,'Still in progress')+stat('✳',data.habits.length,'Habits growing')+stat('▤',data.notes.length,'Notes collected')+'</div><div class="grid two"><section class="card"><h3 style="font:600 17px Playfair Display">A little reflection</h3><textarea class="field note" id="reflection" placeholder="What felt good this week? What would you like to carry forward?">'+esc(data.reflection||'')+'</textarea><button class="btn soft" style="margin-top:10px" id="saveReflection">Save reflection</button></section><section class="card"><h3 style="font:600 17px Playfair Display">Completed tasks</h3>'+(week.filter(t=>t.status==='done').map(t=>'<div class="list-item"><span>✓</span><div class="grow"><h4>'+esc(t.title)+'</h4><p>'+esc(t.category||'Personal')+'</p></div></div>').join('')||empty('Your wins will show up here.'))+'</section></div>'}
function settingsPage(){view.innerHTML=head('YOUR SPACE, YOUR RULES','Data & settings','Your information belongs to you. Manage your preferences and backups here.','')+'<div class="grid two"><section class="card"><h3 style="font:600 17px Playfair Display;margin-top:0">Personalization</h3><label class="muted">Display name</label><input class="field" id="username" value="'+esc(data.settings.username)+'"><div class="row" style="justify-content:space-between;margin-top:17px"><span>Dark mode</span><button class="btn soft small" id="settingsTheme">'+(data.settings.theme==='dark'?'On':'Off')+'</button></div><div class="row" style="justify-content:space-between;margin-top:14px"><span>Lunar calendar display</span><button class="btn soft small" id="settingsLunar">'+(data.settings.lunar?'On':'Off')+'</button></div><button class="btn" style="margin-top:18px" id="saveSettings">Save preferences</button></section><section class="card"><h3 style="font:600 17px Playfair Display;margin-top:0">Data management</h3><p class="muted" style="font-size:12px;line-height:1.7">Export a complete JSON backup or restore your workbench from a previous backup. Data is stored in this browser; clearing browser storage may remove it.</p><div class="row" style="flex-wrap:wrap"><button class="btn" id="exportData">↓ Export JSON</button><button class="btn soft" id="importTrigger">↑ Import backup</button><input type="file" id="importFile" accept=".json,application/json" class="hidden"></div><div style="border-top:1px solid var(--line);margin-top:20px;padding-top:15px"><b>Local storage</b><p class="muted" style="font-size:11px">No account or cloud sync is configured. Keep regular backups if you use multiple devices.</p></div></section></div>'}
function modal(title,fields,submit){document.getElementById('modalRoot').innerHTML='<div class="modal-back" id="backdrop"><form class="modal" id="modalForm"><h3>'+title+'</h3>'+fields+'<div class="modal-actions"><button type="button" class="btn soft" id="cancelModal">Cancel</button><button class="btn" type="submit">Save</button></div></form></div>';document.getElementById('cancelModal').onclick=closeModal;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();submit(new FormData(e.target));closeModal();render()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function addTask(t){data.tasks.unshift({id:uid(),title:t.get('title'),due:t.get('due'),priority:t.get('priority'),quadrant:t.get('quadrant'),category:t.get('category'),notes:t.get('notes'),status:'open',created:today()})}
function taskModal(t){t=t||{};modal(t.id?'Edit task':'A new little task','<label>Task title</label><input class="field" name="title" required value="'+esc(t.title||'')+'"><label>Due date</label><input class="field" name="due" type="date" value="'+esc(t.due||today())+'"><label>Priority</label><select class="field" name="priority"><option '+(t.priority==='Normal'?'selected':'')+'>Normal</option><option '+(t.priority==='High'?'selected':'')+'>High</option><option '+(t.priority==='Low'?'selected':'')+'>Low</option></select><label>Quadrant</label><select class="field" name="quadrant"><option value="important">Do first · urgent & important</option><option value="delegate">Schedule or share</option><option value="not-urgent">Decide later</option><option value="eliminate">Let go</option></select><label>Category</label><input class="field" name="category" value="'+esc(t.category||'Personal')+'"><label>Notes</label><textarea class="field" name="notes">'+esc(t.notes||'')+'</textarea>',f=>{if(t.id){Object.assign(data.tasks.find(x=>x.id===t.id),Object.fromEntries(f))}else addTask(f)})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.page){setPage(b.dataset.page);return}
if(b.dataset.action==='add-task'){taskModal();return}
if(b.dataset.action==='add-plan'){modal('Add to today’s plan','<label>What would you like to do?</label><input class="field" name="title" required><label>Time of day</label><select class="field" name="slot"><option>Morning</option><option>Afternoon</option><option>Evening</option></select>',f=>data.plans.push({id:uid(),title:f.get('title'),slot:f.get('slot'),date:today(),done:false}));return}
if(b.dataset.action==='add-event'){modal('Add a calendar event','<label>Event</label><input class="field" name="title" required><label>Date</label><input class="field" name="date" type="date" required value="'+today()+'">',f=>data.events.push({id:uid(),title:f.get('title'),date:f.get('date')}));return}
if(b.dataset.action==='add-habit'){modal('Plant a little habit','<label>Habit name</label><input class="field" name="name" required placeholder="e.g. Take a short walk">',f=>data.habits.push({id:uid(),name:f.get('name'),days:{}}));return}
if(b.dataset.action==='add-note'){modal('Create a note','<label>Title</label><input class="field" name="title" required><label>Your note</label><textarea class="field note" name="body"></textarea>',f=>data.notes.unshift({id:uid(),title:f.get('title'),body:f.get('body'),updated:today()}));return}
if(b.dataset.done){let t=data.tasks.find(x=>x.id===b.dataset.done);t.status=t.status==='done'?'open':'done';render();return}
if(b.dataset.edit){taskModal(data.tasks.find(x=>x.id===b.dataset.edit));return}
if(b.dataset.planDone){let p=data.plans.find(x=>x.id===b.dataset.planDone);p.done=!p.done;render();return}
if(b.dataset.planDelete){data.plans=data.plans.filter(x=>x.id!==b.dataset.planDelete);render();return}
if(b.dataset.habit){let h=data.habits.find(x=>x.id===b.dataset.habit),d=b.dataset.habitDate;h.days[d]=!h.days[d];render();return}
if(b.dataset.noteEdit){let n=data.notes.find(x=>x.id===b.dataset.noteEdit);modal('Edit note','<label>Title</label><input class="field" name="title" required value="'+esc(n.title)+'"><label>Your note</label><textarea class="field note" name="body">'+esc(n.body)+'</textarea><button type="button" class="btn rose small" id="deleteNote">Delete note</button>',f=>{n.title=f.get('title');n.body=f.get('body');n.updated=today()});document.getElementById('deleteNote').onclick=()=>{data.notes=data.notes.filter(x=>x.id!==n.id);closeModal();render()};return}
if(b.dataset.date){if(b.dataset.date)modal('A note for '+fmt(b.dataset.date),'<label>What is happening?</label><input class="field" name="title" required><input type="hidden" name="date" value="'+b.dataset.date+'">',f=>data.events.push({id:uid(),title:f.get('title'),date:f.get('date')}));return}
if(b.dataset.min){remaining=Number(b.dataset.min)*60;running=false;clearInterval(timer);render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='taskSearch')fillTasks()});
document.addEventListener('change',e=>{if(['taskFilter','taskSort'].includes(e.target.id))fillTasks()});
document.addEventListener('click',e=>{
if(e.target.id==='prevMonth'){month.setMonth(month.getMonth()-1);render()}
if(e.target.id==='nextMonth'){month.setMonth(month.getMonth()+1);render()}
if(e.target.id==='lunarBtn'){data.settings.lunar=!data.settings.lunar;render()}
if(e.target.id==='saveMind'){data.mind=document.getElementById('mindText').value;save();alert('Mind map saved ♡')}
if(e.target.id==='timerToggle'){if(running){clearInterval(timer);running=false;e.target.textContent='Resume'}else{running=true;e.target.textContent='Pause';timer=setInterval(()=>{remaining--;let el=document.getElementById('timerText');if(el)el.textContent=timeStr(remaining);if(remaining<=0){clearInterval(timer);running=false;alert('A little focus session complete. Well done! ♡');render()}},1000)}}
if(e.target.id==='timerReset'){clearInterval(timer);running=false;remaining=1500;render()}
if(e.target.id==='saveReflection'){data.reflection=document.getElementById('reflection').value;save();alert('Reflection saved ♡')}
if(e.target.id==='shareReview'){let text='My little weekly review ♡\nCompleted tasks: '+allDone()+'\nHabits: '+data.habits.length+'\nNotes collected: '+data.notes.length+'\n\n'+(data.reflection||'A little progress is still progress.');navigator.clipboard?.writeText(text).then(()=>alert('Summary copied ♡')).catch(()=>alert(text))}
if(e.target.id==='settingsTheme'){data.settings.theme=data.settings.theme==='dark'?'light':'dark';save();applyTheme();render()}
if(e.target.id==='settingsLunar'){data.settings.lunar=!data.settings.lunar;render()}
if(e.target.id==='saveSettings'){data.settings.username=document.getElementById('username').value;save();render();alert('Preferences saved ♡')}
if(e.target.id==='exportData'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='diaryofagianna-workbench-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
if(e.target.id==='importTrigger')document.getElementById('importFile').click()
});
document.addEventListener('change',e=>{if(e.target.id==='importFile'){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!obj.tasks||!obj.settings)throw Error('Invalid backup');if(confirm('Replace the current workbench data with this backup?')){data=obj;save();applyTheme();render();alert('Backup restored ♡')}}catch(err){alert('Could not read this backup file.')}};r.readAsText(f)}});
render();
})();
</script>
</body></html>
