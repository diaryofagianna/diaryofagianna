name: Workbench cloud sync tests
on:
  pull_request:
    paths:
      - "personal-workbench/**"
  push:
    branches: [main]
    paths:
      - "personal-workbench/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test personal-workbench/tests/*.test.js
